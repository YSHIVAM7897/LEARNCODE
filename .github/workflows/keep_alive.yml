name: Scheduled Ping

on:
  schedule:
    # This runs every 14 minutes
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Server Request
        run: |
          curl -I https://learncode-i5lr.onrender.com/api/data/getLanguage
